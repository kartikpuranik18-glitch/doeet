name: doeet
description: "Doeet — a voice-first productivity workspace with learning tools."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  firebase_messaging: ^15.0.4
  firebase_analytics: ^11.2.1

  # Google Sign In
  google_sign_in: ^6.2.1

  # YouTube
  youtube_player_flutter: ^9.1.1

  # AI
  http: ^1.2.1

  # Images & Media
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.68.0

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  glassmorphism: ^3.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.1
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3

  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.1

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # Markdown rendering (AI assistant)
  flutter_markdown: ^0.7.4
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
